# Corbel contracts. Fork tests run against a local read-only relay (scripts/rpc-relay.ts).
# Forks go through scripts/rpc-relay.ts on 127.0.0.1 (read-only methods only).
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = []
solc_version = "0.8.26"
offline = false
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = []

[rpc_endpoints]
fork = "http://127.0.0.1:8547"

[lint]
# deltas are sign-checked before every narrowing cast; the rest are style notes
exclude_lints = ["unsafe-typecast", "unwrapped-modifier-logic", "mixed-case-variable", "mixed-case-function", "screaming-snake-case-immutable", "asm-keccak256", "erc20-unchecked-transfer"]
